name: Release Artifacts

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  ZIG_GLOBAL_CACHE_DIR: .zig-cache/global
  ZIG_LOCAL_CACHE_DIR: .zig-cache/local

jobs:
  build-inventory-security:
    name: Build inventory security / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Bind trusted POSIX toolchain paths
        id: trusted-posix-tools
        shell: /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: |
          set -euo pipefail

          reject_line_breaks() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" || "$value" == *$'\r'* || "$value" == *$'\n'* ]]; then
              printf '%s is empty or contains a line break\n' "$name" >&2
              exit 1
            fi
          }

          trusted_path="$PATH"
          reject_line_breaks PATH "$trusted_path"
          workspace="${GITHUB_WORKSPACE%/}"
          reject_line_breaks GITHUB_WORKSPACE "$workspace"
          if [[ "$workspace" != /* || ! -d "$workspace" ]]; then
            echo 'GITHUB_WORKSPACE must be an existing absolute directory' >&2
            exit 1
          fi

          resolve_trusted_tool() {
            local name="$1"
            local candidate
            candidate="$(PATH="$trusted_path" command -v "$name")"
            reject_line_breaks "$name" "$candidate"
            if [[ "$candidate" != /* || ! -f "$candidate" || ! -x "$candidate" ]]; then
              printf '%s did not resolve to an absolute executable regular file: %s\n' "$name" "$candidate" >&2
              exit 1
            fi
            case "$candidate" in
              "$workspace"|"$workspace"/*)
                printf '%s resolved inside GITHUB_WORKSPACE: %s\n' "$name" "$candidate" >&2
                exit 1
                ;;
            esac
            printf '%s\n' "$candidate"
          }

          trusted_zig="$(resolve_trusted_tool zig)"
          trusted_python="$(resolve_trusted_tool python3)"
          zig_version="$("$trusted_zig" version)"
          if [[ "$zig_version" != 0.16.0 ]]; then
            echo 'trusted Zig must report exactly version 0.16.0' >&2
            exit 1
          fi
          python_version="$("$trusted_python" -I -B -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')"
          if [[ ! "$python_version" =~ ^3\.[0-9]+\.[0-9]+$ ]]; then
            printf 'trusted Python isolation/version smoke failed: %s\n' "$python_version" >&2
            exit 1
          fi

          printf 'zig=%s\n' "$trusted_zig" >> "$GITHUB_OUTPUT"
          printf 'python=%s\n' "$trusted_python" >> "$GITHUB_OUTPUT"
          printf 'gfortran=\n' >> "$GITHUB_OUTPUT"
          printf 'path=%s\n' "$trusted_path" >> "$GITHUB_OUTPUT"

      - name: Require current-only build inventory policy
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: python3 -B tools/check_build_inventory.py --root . --require-current-only

      - name: Require current-only test inventory policy
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: python3 -B tools/check_test_inventory.py --root . --structure-only --require-current-only

      - name: Run build inventory security suite
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: python3 -B test/build/test_build_inventory.py

  test-inventory-security:
    name: Test inventory security / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Bind trusted POSIX toolchain paths
        id: trusted-posix-tools
        shell: /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: |
          set -euo pipefail

          reject_line_breaks() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" || "$value" == *$'\r'* || "$value" == *$'\n'* ]]; then
              printf '%s is empty or contains a line break\n' "$name" >&2
              exit 1
            fi
          }

          trusted_path="$PATH"
          reject_line_breaks PATH "$trusted_path"
          workspace="${GITHUB_WORKSPACE%/}"
          reject_line_breaks GITHUB_WORKSPACE "$workspace"
          if [[ "$workspace" != /* || ! -d "$workspace" ]]; then
            echo 'GITHUB_WORKSPACE must be an existing absolute directory' >&2
            exit 1
          fi

          resolve_trusted_tool() {
            local name="$1"
            local candidate
            candidate="$(PATH="$trusted_path" command -v "$name")"
            reject_line_breaks "$name" "$candidate"
            if [[ "$candidate" != /* || ! -f "$candidate" || ! -x "$candidate" ]]; then
              printf '%s did not resolve to an absolute executable regular file: %s\n' "$name" "$candidate" >&2
              exit 1
            fi
            case "$candidate" in
              "$workspace"|"$workspace"/*)
                printf '%s resolved inside GITHUB_WORKSPACE: %s\n' "$name" "$candidate" >&2
                exit 1
                ;;
            esac
            printf '%s\n' "$candidate"
          }

          trusted_zig="$(resolve_trusted_tool zig)"
          trusted_python="$(resolve_trusted_tool python3)"
          zig_version="$("$trusted_zig" version)"
          if [[ "$zig_version" != 0.16.0 ]]; then
            echo 'trusted Zig must report exactly version 0.16.0' >&2
            exit 1
          fi
          python_version="$("$trusted_python" -I -B -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')"
          if [[ ! "$python_version" =~ ^3\.[0-9]+\.[0-9]+$ ]]; then
            printf 'trusted Python isolation/version smoke failed: %s\n' "$python_version" >&2
            exit 1
          fi

          printf 'zig=%s\n' "$trusted_zig" >> "$GITHUB_OUTPUT"
          printf 'python=%s\n' "$trusted_python" >> "$GITHUB_OUTPUT"
          printf 'gfortran=\n' >> "$GITHUB_OUTPUT"
          printf 'path=%s\n' "$trusted_path" >> "$GITHUB_OUTPUT"

      - name: Require current-only test inventory policy
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: python3 -B tools/check_test_inventory.py --root . --structure-only --require-current-only

      - name: Run test inventory security suite
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: python3 -B test/build/test_test_inventory.py

  artifacts:
    name: ${{ matrix.os }}
    needs: [build-inventory-security, test-inventory-security]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: zynum-blas-macos
            dynlib: zig-out/lib/libzynum_blas.dylib
            target_args: -Dtarget=aarch64-macos -Dcpu=baseline
          - os: ubuntu-24.04
            artifact: zynum-blas-linux
            dynlib: zig-out/lib/libzynum_blas.so
            target_args: -Dtarget=x86_64-linux-gnu -Dcpu=baseline
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .zig-cache
          key: zig-release-${{ runner.os }}-${{ runner.arch }}-0.16.0-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-release-${{ runner.os }}-${{ runner.arch }}-0.16.0-

      - name: Bind trusted POSIX toolchain paths and require Fortran on Linux
        id: trusted-posix-tools
        shell: /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          REQUIRE_FORTRAN: ${{ runner.os == 'Linux' }}
        run: |
          set -euo pipefail

          reject_line_breaks() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" || "$value" == *$'\r'* || "$value" == *$'\n'* ]]; then
              printf '%s is empty or contains a line break\n' "$name" >&2
              exit 1
            fi
          }

          trusted_path="$PATH"
          reject_line_breaks PATH "$trusted_path"
          workspace="${GITHUB_WORKSPACE%/}"
          reject_line_breaks GITHUB_WORKSPACE "$workspace"
          if [[ "$workspace" != /* || ! -d "$workspace" ]]; then
            echo 'GITHUB_WORKSPACE must be an existing absolute directory' >&2
            exit 1
          fi

          resolve_trusted_tool() {
            local name="$1"
            local candidate
            candidate="$(PATH="$trusted_path" command -v "$name")"
            reject_line_breaks "$name" "$candidate"
            if [[ "$candidate" != /* || ! -f "$candidate" || ! -x "$candidate" ]]; then
              printf '%s did not resolve to an absolute executable regular file: %s\n' "$name" "$candidate" >&2
              exit 1
            fi
            case "$candidate" in
              "$workspace"|"$workspace"/*)
                printf '%s resolved inside GITHUB_WORKSPACE: %s\n' "$name" "$candidate" >&2
                exit 1
                ;;
            esac
            printf '%s\n' "$candidate"
          }

          trusted_zig="$(resolve_trusted_tool zig)"
          trusted_python="$(resolve_trusted_tool python3)"
          zig_version="$("$trusted_zig" version)"
          if [[ "$zig_version" != 0.16.0 ]]; then
            echo 'trusted Zig must report exactly version 0.16.0' >&2
            exit 1
          fi
          python_version="$("$trusted_python" -I -B -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')"
          if [[ ! "$python_version" =~ ^3\.[0-9]+\.[0-9]+$ ]]; then
            printf 'trusted Python isolation/version smoke failed: %s\n' "$python_version" >&2
            exit 1
          fi

          trusted_gfortran=''
          if [[ "$REQUIRE_FORTRAN" == true ]]; then
            trusted_gfortran="$(resolve_trusted_tool gfortran)"
            "$trusted_gfortran" --version >/dev/null
          fi

          printf 'zig=%s\n' "$trusted_zig" >> "$GITHUB_OUTPUT"
          printf 'python=%s\n' "$trusted_python" >> "$GITHUB_OUTPUT"
          printf 'gfortran=%s\n' "$trusted_gfortran" >> "$GITHUB_OUTPUT"
          printf 'path=%s\n' "$trusted_path" >> "$GITHUB_OUTPUT"

      - name: Regenerate compatibility files
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: |
          zig build generate-headers --summary failures
          zig build generate-kernel-coverage --summary failures

      - name: Check generated files are up to date
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: |
          set -euo pipefail
          git --no-pager diff --exit-code -- include/zynum/blas docs/kernel_coverage.json
          status="$(git status --porcelain --untracked-files=all -- include/zynum/blas docs/kernel_coverage.json)"
          if [[ -n "$status" ]]; then
            echo "Generated compatibility headers or kernel coverage are out of date."
            printf '%s\n' "$status"
            exit 1
          fi

      - name: Require current-only build inventory policy
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: python3 -B tools/check_build_inventory.py --root . --require-current-only

      - name: Require current-only test inventory policy
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: python3 -B tools/check_test_inventory.py --root . --structure-only --require-current-only

      - name: Run host tool smoke once
        timeout-minutes: 60
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: zig build test-host-tool-smoke ${{ matrix.target_args }} --summary failures

      - name: Test
        timeout-minutes: 60
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: zig build test ${{ matrix.target_args }} -Dtest-optimize=ReleaseSafe -Dhost-tool-smoke=false --summary failures

      - name: Build install tree
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: zig build ${{ matrix.target_args }} --release=fast --summary failures

      - name: Check ABI manifest
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: |
          python3 tools/check_abi_manifest.py \
            --manifest include/zynum/blas/abi_manifest.json \
            --dynamic "${{ matrix.dynlib }}" \
            --static zig-out/lib/libzynum_blas.a

      - name: Require clean committed checkout before archiving
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: |
          set -euo pipefail
          git rev-parse --verify 'HEAD^{commit}' >/dev/null
          git --no-pager diff --exit-code
          git --no-pager diff --cached --exit-code
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            echo "Release archives require a clean committed checkout."
            printf '%s\n' "$status"
            exit 1
          fi

      - name: Provision fresh publication workspace
        id: publication_workspace
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: |
          set -euo pipefail
          workspace="$(mktemp -d "${RUNNER_TEMP}/zynum-publication.XXXXXXXX")"
          if find "$workspace" -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
            echo "fresh publication workspace is not empty" >&2
            exit 1
          fi
          printf 'path=%s\n' "$workspace" >> "$GITHUB_OUTPUT"

      - name: Pack source archive
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: |
          python3 tools/check_package_paths.py \
            --archive "${{ steps.publication_workspace.outputs.path }}/zynum-source-${{ matrix.artifact }}.tar.gz"

      - name: Pack artifact
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: |
          set -euo pipefail
          workspace="${{ steps.publication_workspace.outputs.path }}"
          binary_archive="$workspace/${{ matrix.artifact }}.tar.gz"
          tar -czf "$binary_archive" \
            -C zig-out lib include \
            -C "$GITHUB_WORKSPACE" LICENSE COPYING COPYING.LESSER
          licenses=(LICENSE COPYING COPYING.LESSER)
          members="$(tar -tzf "$binary_archive")"
          for license in "${licenses[@]}"; do
            count="$(printf '%s\n' "$members" | grep -Fxc "$license" || true)"
            test "$count" -eq 1
            tar -xOzf "$binary_archive" "$license" \
              | cmp - "$GITHUB_WORKSPACE/$license"
          done
          (
            cd "$workspace"
            shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
            shasum -a 256 "zynum-source-${{ matrix.artifact }}.tar.gz" > "zynum-source-${{ matrix.artifact }}.tar.gz.sha256"
          )

      - name: Verify publication workspace
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: |
          set -euo pipefail
          workspace="${{ steps.publication_workspace.outputs.path }}"
          arena="$workspace/.zynum-cleanup-v2-$(id -u)"
          test -d "$arena" && test ! -L "$arena"
          if find "$arena" -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
            echo "publication cleanup arena retained material" >&2
            exit 1
          fi
          for artifact in \
            "${{ matrix.artifact }}.tar.gz" \
            "${{ matrix.artifact }}.tar.gz.sha256" \
            "zynum-source-${{ matrix.artifact }}.tar.gz" \
            "zynum-source-${{ matrix.artifact }}.tar.gz.sha256"; do
            test -f "$workspace/$artifact" && test ! -L "$workspace/$artifact"
          done
          test "$(find "$workspace" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" -eq 5

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ steps.publication_workspace.outputs.path }}/${{ matrix.artifact }}.tar.gz
            ${{ steps.publication_workspace.outputs.path }}/${{ matrix.artifact }}.tar.gz.sha256
            ${{ steps.publication_workspace.outputs.path }}/zynum-source-${{ matrix.artifact }}.tar.gz
            ${{ steps.publication_workspace.outputs.path }}/zynum-source-${{ matrix.artifact }}.tar.gz.sha256
