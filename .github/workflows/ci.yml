name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ZIG_GLOBAL_CACHE_DIR: .zig-cache/global
  ZIG_LOCAL_CACHE_DIR: .zig-cache/local

jobs:
  source-checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .zig-cache
          key: zig-source-${{ runner.os }}-${{ runner.arch }}-0.16.0-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-source-${{ runner.os }}-${{ runner.arch }}-0.16.0-

      - name: Bind trusted POSIX toolchain paths
        id: trusted-posix-tools
        shell: /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: |
          set -euo pipefail

          reject_line_breaks() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" || "$value" == *$'\r'* || "$value" == *$'\n'* ]]; then
              printf '%s is empty or contains a line break\n' "$name" >&2
              exit 1
            fi
          }

          trusted_path="$PATH"
          reject_line_breaks PATH "$trusted_path"
          workspace="${GITHUB_WORKSPACE%/}"
          reject_line_breaks GITHUB_WORKSPACE "$workspace"
          if [[ "$workspace" != /* || ! -d "$workspace" ]]; then
            echo 'GITHUB_WORKSPACE must be an existing absolute directory' >&2
            exit 1
          fi

          resolve_trusted_tool() {
            local name="$1"
            local candidate
            candidate="$(PATH="$trusted_path" command -v "$name")"
            reject_line_breaks "$name" "$candidate"
            if [[ "$candidate" != /* || ! -f "$candidate" || ! -x "$candidate" ]]; then
              printf '%s did not resolve to an absolute executable regular file: %s\n' "$name" "$candidate" >&2
              exit 1
            fi
            case "$candidate" in
              "$workspace"|"$workspace"/*)
                printf '%s resolved inside GITHUB_WORKSPACE: %s\n' "$name" "$candidate" >&2
                exit 1
                ;;
            esac
            printf '%s\n' "$candidate"
          }

          trusted_zig="$(resolve_trusted_tool zig)"
          trusted_python="$(resolve_trusted_tool python3)"
          zig_version="$("$trusted_zig" version)"
          if [[ "$zig_version" != 0.16.0 ]]; then
            echo 'trusted Zig must report exactly version 0.16.0' >&2
            exit 1
          fi
          python_version="$("$trusted_python" -I -B -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')"
          if [[ ! "$python_version" =~ ^3\.[0-9]+\.[0-9]+$ ]]; then
            printf 'trusted Python isolation/version smoke failed: %s\n' "$python_version" >&2
            exit 1
          fi

          printf 'zig=%s\n' "$trusted_zig" >> "$GITHUB_OUTPUT"
          printf 'python=%s\n' "$trusted_python" >> "$GITHUB_OUTPUT"
          printf 'gfortran=\n' >> "$GITHUB_OUTPUT"
          printf 'path=%s\n' "$trusted_path" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: zig fmt --check build.zig build.zig.zon src test bench examples tools

      - name: Check Python tools compile
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: env PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile bench/tools/*.py tools/*.py

      - name: Check build inventory
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: python3 -B tools/check_build_inventory.py --root .

      - name: Check test inventory structure
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: python3 -B tools/check_test_inventory.py --root . --structure-only

      - name: Check package paths
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: python3 tools/check_package_paths.py --archive zig-out/ci/zynum-source.tar.gz

      - name: Regenerate compatibility headers and kernel coverage
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: |
          zig build generate-headers --summary failures
          zig build generate-kernel-coverage --summary failures

      - name: Check generated files are up to date
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          PATH: ${{ steps.trusted-posix-tools.outputs.path }}
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: |
          set -euo pipefail
          git --no-pager diff --exit-code -- include/zynum/blas docs/kernel_coverage.json
          status="$(git status --porcelain --untracked-files=all -- include/zynum/blas docs/kernel_coverage.json)"
          if [[ -n "$status" ]]; then
            echo "Generated compatibility headers or kernel coverage are out of date."
            printf '%s\n' "$status"
            exit 1
          fi

  build-inventory-security:
    name: Build inventory security / ${{ matrix.os }}
    needs: source-checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Run build inventory security suite
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: python3 -B test/build/test_build_inventory.py

  test-inventory-security:
    name: Test inventory security
    needs: source-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Run test inventory security suite
        shell: /usr/bin/env BASH_ENV=/dev/null ENV=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: python3 -B test/build/test_test_inventory.py

  target-tests:
    name: ${{ matrix.name }}
    needs: [source-checks, build-inventory-security, test-inventory-security]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS / aarch64 baseline
            os: macos-15
            cache_target: macos-aarch64-baseline
            zig_gate: inventory-certified
            target_args: -Dtarget=aarch64-macos -Dcpu=baseline
            install: true
            dynlib: zig-out/lib/libzynum_blas.dylib
            full_smoke: false
          - name: Linux / x86_64 baseline
            os: ubuntu-24.04
            cache_target: linux-x86_64-baseline
            zig_gate: inventory-certified
            target_args: -Dtarget=x86_64-linux-gnu -Dcpu=baseline
            install: true
            dynlib: zig-out/lib/libzynum_blas.so
            full_smoke: true
          - name: Linux / ARM64 baseline
            os: ubuntu-24.04-arm
            cache_target: linux-arm64-baseline
            zig_gate: link-only
            target_args: -Dtarget=aarch64-linux-gnu -Dcpu=baseline
            install: true
            dynlib: zig-out/lib/libzynum_blas.so
            full_smoke: false
          - name: Windows / x86_64 native compile/link compatibility smoke
            os: windows-2025
            cache_target: windows-x86_64-baseline
            zig_gate: windows-native-compile-link-smoke
            target_args: -Dtarget=x86_64-windows-gnu -Dcpu=baseline
            install: false
            dynlib: ""
            full_smoke: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .zig-cache
          key: zig-test-${{ runner.os }}-${{ runner.arch }}-0.16.0-${{ matrix.cache_target }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-test-${{ runner.os }}-${{ runner.arch }}-0.16.0-${{ matrix.cache_target }}-
            zig-test-${{ runner.os }}-${{ runner.arch }}-0.16.0-

      - name: Bind trusted Windows toolchain paths
        id: trusted-windows-tools
        if: runner.os == 'Windows'
        shell: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'Stop'; $env:GITHUB_ENV = 'NUL'; $env:GITHUB_PATH = 'NUL'; & ([scriptblock]::Create([IO.File]::ReadAllText('{0}'))); if (Test-Path -LiteralPath variable:\LASTEXITCODE) {{ exit $LASTEXITCODE }}"
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Assert-SafeScalar([string] $name, [string] $value) {
            if ([string]::IsNullOrEmpty($value) -or $value.Contains("`r") -or $value.Contains("`n")) {
              throw "$name is empty or contains a line break"
            }
          }

          function Test-DriveRootedAbsolute([string] $path) {
            return [IO.Path]::IsPathRooted($path) -and $path -match '^[A-Za-z]:[\\/]'
          }

          $trustedPath = [Environment]::GetEnvironmentVariable('PATH', 'Process')
          Assert-SafeScalar 'PATH' $trustedPath
          $workspaceInput = $env:GITHUB_WORKSPACE
          Assert-SafeScalar 'GITHUB_WORKSPACE' $workspaceInput
          if (-not (Test-DriveRootedAbsolute $workspaceInput) -or -not [IO.Directory]::Exists($workspaceInput)) {
            throw 'GITHUB_WORKSPACE must be an existing absolute directory'
          }
          $workspace = [IO.Path]::GetFullPath($workspaceInput).TrimEnd([char[]]@('\', '/'))
          $workspacePrefix = $workspace + [IO.Path]::DirectorySeparatorChar

          function Resolve-TrustedApplication([string] $name) {
            $commands = @(Get-Command -Name $name -CommandType Application -All -ErrorAction Stop)
            if ($commands.Count -eq 0) {
              throw "$name is not available as an application"
            }
            $candidate = $commands[0].Path
            Assert-SafeScalar $name $candidate
            if (-not (Test-DriveRootedAbsolute $candidate)) {
              throw "$name did not resolve to an absolute path: $candidate"
            }
            $candidate = [IO.Path]::GetFullPath($candidate)
            $item = Get-Item -LiteralPath $candidate -Force -ErrorAction Stop
            if ($item -isnot [IO.FileInfo] -or -not [IO.File]::Exists($candidate) -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              throw "$name did not resolve to an existing regular file: $candidate"
            }
            if ($candidate.Equals($workspace, [StringComparison]::OrdinalIgnoreCase) -or $candidate.StartsWith($workspacePrefix, [StringComparison]::OrdinalIgnoreCase)) {
              throw "$name resolved inside GITHUB_WORKSPACE: $candidate"
            }
            return $candidate
          }

          $trustedZig = Resolve-TrustedApplication 'zig'
          $trustedPython = Resolve-TrustedApplication 'python'
          $zigVersion = @(& $trustedZig version)
          if ($LASTEXITCODE -ne 0 -or $zigVersion.Count -ne 1 -or $zigVersion[0] -cne '0.16.0') {
            throw "trusted Zig must report exactly version 0.16.0; observed: $($zigVersion -join ', ')"
          }
          $pythonVersion = @(& $trustedPython -I -B -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')
          if ($LASTEXITCODE -ne 0 -or $pythonVersion.Count -ne 1 -or $pythonVersion[0] -notmatch '^3\.[0-9]+\.[0-9]+$') {
            throw "trusted Python isolation/version smoke failed; observed: $($pythonVersion -join ', ')"
          }

          $utf8NoBom = New-Object Text.UTF8Encoding($false)
          [IO.File]::AppendAllLines($env:GITHUB_OUTPUT, [string[]] @(
            "zig=$trustedZig"
            "python=$trustedPython"
            "path=$trustedPath"
          ), $utf8NoBom)

      - name: Bind trusted POSIX toolchain paths and require Fortran for full smoke
        id: trusted-posix-tools
        if: runner.os != 'Windows'
        shell: /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          REQUIRE_FORTRAN: ${{ matrix.full_smoke && runner.os == 'Linux' }}
        run: |
          set -euo pipefail

          reject_line_breaks() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" || "$value" == *$'\r'* || "$value" == *$'\n'* ]]; then
              printf '%s is empty or contains a line break\n' "$name" >&2
              exit 1
            fi
          }

          trusted_path="$PATH"
          reject_line_breaks PATH "$trusted_path"
          workspace="${GITHUB_WORKSPACE%/}"
          reject_line_breaks GITHUB_WORKSPACE "$workspace"
          if [[ "$workspace" != /* || ! -d "$workspace" ]]; then
            echo 'GITHUB_WORKSPACE must be an existing absolute directory' >&2
            exit 1
          fi

          resolve_trusted_tool() {
            local name="$1"
            local candidate
            candidate="$(PATH="$trusted_path" command -v "$name")"
            reject_line_breaks "$name" "$candidate"
            if [[ "$candidate" != /* || ! -f "$candidate" || ! -x "$candidate" ]]; then
              printf '%s did not resolve to an absolute executable regular file: %s\n' "$name" "$candidate" >&2
              exit 1
            fi
            case "$candidate" in
              "$workspace"|"$workspace"/*)
                printf '%s resolved inside GITHUB_WORKSPACE: %s\n' "$name" "$candidate" >&2
                exit 1
                ;;
            esac
            printf '%s\n' "$candidate"
          }

          trusted_zig="$(resolve_trusted_tool zig)"
          trusted_python="$(resolve_trusted_tool python3)"
          zig_version="$("$trusted_zig" version)"
          if [[ "$zig_version" != 0.16.0 ]]; then
            echo 'trusted Zig must report exactly version 0.16.0' >&2
            exit 1
          fi
          python_version="$("$trusted_python" -I -B -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')"
          if [[ ! "$python_version" =~ ^3\.[0-9]+\.[0-9]+$ ]]; then
            printf 'trusted Python isolation/version smoke failed: %s\n' "$python_version" >&2
            exit 1
          fi

          trusted_gfortran=''
          if [[ "$REQUIRE_FORTRAN" == true ]]; then
            trusted_gfortran="$(resolve_trusted_tool gfortran)"
            "$trusted_gfortran" --version >/dev/null
          fi

          printf 'zig=%s\n' "$trusted_zig" >> "$GITHUB_OUTPUT"
          printf 'python=%s\n' "$trusted_python" >> "$GITHUB_OUTPUT"
          printf 'gfortran=%s\n' "$trusted_gfortran" >> "$GITHUB_OUTPUT"
          printf 'path=%s\n' "$trusted_path" >> "$GITHUB_OUTPUT"

      - name: Build Windows Python tooling executable fixtures and libraries
        if: runner.os == 'Windows' && matrix.cache_target == 'windows-x86_64-baseline'
        shell: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'Stop'; $env:GITHUB_ENV = 'NUL'; $env:GITHUB_PATH = 'NUL'; & ([scriptblock]::Create([IO.File]::ReadAllText('{0}'))); if (Test-Path -LiteralPath variable:\LASTEXITCODE) {{ exit $LASTEXITCODE }}"
        env:
          TRUSTED_PATH: ${{ steps.trusted-windows-tools.outputs.path }}
          TRUSTED_ZIG: ${{ steps.trusted-windows-tools.outputs.zig }}
          TRUSTED_PYTHON: ${{ steps.trusted-windows-tools.outputs.python }}
        run: |
          Set-StrictMode -Version Latest
          $env:PATH = $env:TRUSTED_PATH
          $ErrorActionPreference = 'Stop'
          $dynamicLibrary = 'zig-out/bin/zynum_blas.dll'
          if (Test-Path -LiteralPath $dynamicLibrary) {
            Write-Error "canonical Windows DLL already exists before the reviewed build: $dynamicLibrary"
            exit 1
          }
          & $env:TRUSTED_ZIG build install-libraries build-rank-k-probe build-rotg-latency-probe build-symm-probe build-triangular-matrix-probe ${{ matrix.target_args }} --release=fast --summary failures
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Check Windows library layout and tooling fixture boundary
        if: runner.os == 'Windows' && matrix.cache_target == 'windows-x86_64-baseline'
        shell: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'Stop'; $env:GITHUB_ENV = 'NUL'; $env:GITHUB_PATH = 'NUL'; & ([scriptblock]::Create([IO.File]::ReadAllText('{0}'))); if (Test-Path -LiteralPath variable:\LASTEXITCODE) {{ exit $LASTEXITCODE }}"
        env:
          TRUSTED_PATH: ${{ steps.trusted-windows-tools.outputs.path }}
          TRUSTED_ZIG: ${{ steps.trusted-windows-tools.outputs.zig }}
          TRUSTED_PYTHON: ${{ steps.trusted-windows-tools.outputs.python }}
        run: |
          Set-StrictMode -Version Latest
          $env:PATH = $env:TRUSTED_PATH
          $ErrorActionPreference = 'Stop'
          $dynamicLibrary = 'zig-out/bin/zynum_blas.dll'
          $importLibrary = 'zig-out/lib/zynum_blas.lib'
          $staticLibrary = 'zig-out/lib/static/zynum_blas.lib'
          $libraryPaths = @($dynamicLibrary, $importLibrary, $staticLibrary)
          foreach ($path in $libraryPaths) {
            $artifact = Get-Item -LiteralPath $path -ErrorAction Stop
            if ($artifact.PSIsContainer -or $artifact.Length -eq 0) {
              Write-Error "expected a nonempty regular library artifact at $path"
              exit 1
            }
          }
          $resolvedPaths = @($libraryPaths | ForEach-Object { (Resolve-Path -LiteralPath $_).Path })
          if (@($resolvedPaths | Sort-Object -Unique).Count -ne 3) {
            Write-Error 'Windows dynamic, import, and static artifacts must have distinct paths'
            exit 1
          }
          $libraryHashes = @($libraryPaths | ForEach-Object { (Get-FileHash -Algorithm SHA256 -LiteralPath $_).Hash })
          if (@($libraryHashes | Sort-Object -Unique).Count -ne 3) {
            Write-Error 'Windows dynamic, import, and static artifacts must have distinct contents'
            exit 1
          }
          $installedDlls = @(Get-ChildItem -LiteralPath (Split-Path -Parent $dynamicLibrary) -Filter '*.dll' -File -Force)
          if ($installedDlls.Count -ne 1 -or $installedDlls[0].Name -cne 'zynum_blas.dll') {
            Write-Error 'canonical Windows DLL directory must contain exactly zynum_blas.dll and no additional DLLs'
            exit 1
          }
          $hardlinkPaths = @(fsutil hardlink list $dynamicLibrary | Where-Object { $_.Trim().Length -gt 0 })
          if ($LASTEXITCODE -ne 0 -or $hardlinkPaths.Count -ne 1) {
            Write-Error "canonical Windows DLL must have exactly one hardlink path, found $($hardlinkPaths.Count)"
            exit 1
          }
          $importMembers = @(& $env:TRUSTED_ZIG ar t $importLibrary)
          if ($LASTEXITCODE -ne 0 -or @($importMembers | Where-Object { $_ -ceq 'zynum_blas.dll' }).Count -eq 0) {
            Write-Error 'zynum_blas.lib is not the reviewed DLL import library'
            exit 1
          }
          $staticMembers = @(& $env:TRUSTED_ZIG ar t $staticLibrary)
          if ($LASTEXITCODE -ne 0 -or $staticMembers.Count -eq 0 -or @($staticMembers | Where-Object { $_ -like '*.dll' }).Count -ne 0) {
            Write-Error 'lib/static/zynum_blas.lib is not the reviewed static object archive'
            exit 1
          }
          $unsupportedExecutables = @(
            'bench-zynum-blas.exe',
            'gemm-sweep.exe',
            'vector-matrix-sweep.exe',
            'level1-probe.exe',
            'dcopy-probe.exe'
          )
          foreach ($name in $unsupportedExecutables) {
            if (Test-Path -LiteralPath (Join-Path 'zig-out/bin' $name)) {
              Write-Error "unsupported Windows executable leaked into the default installation: $name"
              exit 1
            }
          }

      - name: Run Windows DLL ABI and CBLAS L1-L3 compatibility smoke (not inventory evidence)
        if: runner.os == 'Windows' && matrix.cache_target == 'windows-x86_64-baseline'
        shell: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'Stop'; $env:GITHUB_ENV = 'NUL'; $env:GITHUB_PATH = 'NUL'; & ([scriptblock]::Create([IO.File]::ReadAllText('{0}'))); if (Test-Path -LiteralPath variable:\LASTEXITCODE) {{ exit $LASTEXITCODE }}"
        timeout-minutes: 15
        env:
          TRUSTED_PATH: ${{ steps.trusted-windows-tools.outputs.path }}
          TRUSTED_ZIG: ${{ steps.trusted-windows-tools.outputs.zig }}
          TRUSTED_PYTHON: ${{ steps.trusted-windows-tools.outputs.python }}
        run: |
          Set-StrictMode -Version Latest
          $env:PATH = $env:TRUSTED_PATH
          $ErrorActionPreference = 'Stop'

          $env:PYTHONHOME = $null
          $env:PYTHONPATH = $null
          $env:PYTHONINSPECT = $null
          $env:PYTHONSTARTUP = $null
          $env:GIT_PAGER = $null
          $env:PAGER = $null
          $env:LESS = $null

          $smokeScript = @'
          import ctypes
          import json
          import math
          import os
          import re
          import stat
          import sys
          from pathlib import Path

          if len(sys.argv) != 2:
              raise SystemExit("Windows CBLAS smoke requires exactly one completion nonce")
          completion_nonce = sys.argv[1]
          if re.fullmatch(r"[0-9a-f]{32}", completion_nonce, flags=re.ASCII) is None:
              raise SystemExit("Windows CBLAS smoke completion nonce is invalid")

          repository_root = Path.cwd().resolve(strict=True)
          requested_dll = repository_root / "zig-out/bin/zynum_blas.dll"
          with os.scandir(requested_dll.parent) as entries:
              dll_entries = [
                  entry for entry in entries if entry.name.lower().endswith(".dll")
              ]
          if len(dll_entries) != 1 or dll_entries[0].name != requested_dll.name:
              raise SystemExit(
                  "canonical Windows DLL directory must contain exactly "
                  "zynum_blas.dll and no additional DLLs"
              )
          requested_stat = os.stat(requested_dll, follow_symlinks=False)
          if (
              getattr(requested_stat, "st_file_attributes", 0)
              & stat.FILE_ATTRIBUTE_REPARSE_POINT
          ):
              raise SystemExit("canonical Windows DLL must not be a reparse point")
          if (
              not stat.S_ISREG(requested_stat.st_mode)
              or requested_stat.st_size <= 0
              or requested_stat.st_nlink != 1
          ):
              raise SystemExit(
                  "canonical Windows DLL must be a nonempty regular file with one hardlink"
              )
          canonical_dll = requested_dll.resolve(strict=True)
          if os.path.normcase(str(canonical_dll)) != os.path.normcase(str(requested_dll)):
              raise SystemExit("canonical Windows DLL path resolves through an alias")

          library = ctypes.CDLL(str(canonical_dll), winmode=0x00000900)
          kernel32 = ctypes.WinDLL("kernel32", use_last_error=True)
          get_module_filename = kernel32.GetModuleFileNameW
          get_module_filename.argtypes = [
              ctypes.c_void_p,
              ctypes.POINTER(ctypes.c_wchar),
              ctypes.c_uint32,
          ]
          get_module_filename.restype = ctypes.c_uint32
          module_path_buffer = ctypes.create_unicode_buffer(32768)
          module_path_length = get_module_filename(
              library._handle, module_path_buffer, len(module_path_buffer)
          )
          if module_path_length == 0 or module_path_length >= len(module_path_buffer):
              raise OSError(ctypes.get_last_error(), "cannot resolve loaded Windows DLL path")
          loaded_dll = Path(module_path_buffer.value).resolve(strict=True)
          if os.path.normcase(str(loaded_dll)) != os.path.normcase(str(canonical_dll)):
              raise SystemExit("loaded Windows DLL differs from the canonical build artifact")

          manifest_path = repository_root / "include/zynum/blas/abi_manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          export_names = []
          symbol_pattern = re.compile(r"^[A-Za-z_][A-Za-z0-9_]*$", flags=re.ASCII)
          for section_name in ("fortran", "cblas"):
              section = manifest[section_name]
              section_exports = section["exports"]
              if section["export_count"] != len(section_exports):
                  raise SystemExit(f"{section_name} ABI export count is inconsistent")
              for item in section_exports:
                  name = item.get("name") if isinstance(item, dict) else None
                  if (
                      not isinstance(name, str)
                      or "\x00" in name
                      or any(ord(character) < 0x20 or ord(character) == 0x7F for character in name)
                      or symbol_pattern.fullmatch(name) is None
                  ):
                      raise SystemExit(f"Windows DLL manifest export name is invalid: {name!r}")
                  export_names.append(name)
          if len(export_names) != 311 or len(set(export_names)) != 311:
              raise SystemExit("Windows DLL preflight requires exactly 311 unique ABI exports")
          encoded_export_names = [name.encode("ascii") for name in export_names]
          if len(set(encoded_export_names)) != 311:
              raise SystemExit("Windows DLL preflight requires unique ASCII export encodings")

          get_proc_address = kernel32.GetProcAddress
          get_proc_address.argtypes = [ctypes.c_void_p, ctypes.c_char_p]
          get_proc_address.restype = ctypes.c_void_p
          missing_exports = [
              name
              for name, encoded_name in zip(export_names, encoded_export_names)
              if not get_proc_address(library._handle, encoded_name)
          ]
          if missing_exports:
              raise SystemExit(f"Windows DLL is missing ABI exports: {missing_exports}")
          print(
              f"Windows DLL preflight passed for {canonical_dll} "
              f"({len(export_names)} exports)",
              file=sys.stderr,
              flush=True,
          )

          double_pointer = ctypes.POINTER(ctypes.c_double)
          cblas_daxpy = library.cblas_daxpy
          cblas_daxpy.argtypes = [
              ctypes.c_int,
              ctypes.c_double,
              double_pointer,
              ctypes.c_int,
              double_pointer,
              ctypes.c_int,
          ]
          cblas_daxpy.restype = None
          cblas_dgemv = library.cblas_dgemv
          cblas_dgemv.argtypes = [
              ctypes.c_int,
              ctypes.c_int,
              ctypes.c_int,
              ctypes.c_int,
              ctypes.c_double,
              double_pointer,
              ctypes.c_int,
              double_pointer,
              ctypes.c_int,
              ctypes.c_double,
              double_pointer,
              ctypes.c_int,
          ]
          cblas_dgemv.restype = None
          cblas_dgemm = library.cblas_dgemm
          cblas_dgemm.argtypes = [
              ctypes.c_int,
              ctypes.c_int,
              ctypes.c_int,
              ctypes.c_int,
              ctypes.c_int,
              ctypes.c_int,
              ctypes.c_double,
              double_pointer,
              ctypes.c_int,
              double_pointer,
              ctypes.c_int,
              ctypes.c_double,
              double_pointer,
              ctypes.c_int,
          ]
          cblas_dgemm.restype = None

          CBLAS_ROW_MAJOR = 101
          CBLAS_NO_TRANS = 111

          def run_cblas_daxpy():
              x = (ctypes.c_double * 3)(1, -2, 3)
              y = (ctypes.c_double * 3)(4, 5, -6)
              cblas_daxpy(3, 2, x, 1, y, 1)
              return list(y), [6.0, 1.0, 0.0]

          def run_cblas_dgemv():
              matrix = (ctypes.c_double * 6)(1, 2, 3, 4, 5, 6)
              x = (ctypes.c_double * 3)(1, -1, 2)
              y = (ctypes.c_double * 2)(0, 0)
              cblas_dgemv(
                  CBLAS_ROW_MAJOR,
                  CBLAS_NO_TRANS,
                  2,
                  3,
                  1,
                  matrix,
                  3,
                  x,
                  1,
                  0,
                  y,
                  1,
              )
              return list(y), [5.0, 11.0]

          def run_cblas_dgemm():
              matrix_a = (ctypes.c_double * 6)(1, 2, 3, 4, 5, 6)
              matrix_b = (ctypes.c_double * 6)(7, 8, 9, 10, 11, 12)
              matrix_c = (ctypes.c_double * 4)(0, 0, 0, 0)
              cblas_dgemm(
                  CBLAS_ROW_MAJOR,
                  CBLAS_NO_TRANS,
                  CBLAS_NO_TRANS,
                  2,
                  2,
                  3,
                  1,
                  matrix_a,
                  3,
                  matrix_b,
                  2,
                  0,
                  matrix_c,
                  2,
              )
              return list(matrix_c), [58.0, 64.0, 139.0, 154.0]

          expected_case_ids = (
              "cblas-daxpy-l1",
              "cblas-dgemv-l2",
              "cblas-dgemm-l3",
          )
          cases = (
              ("cblas-daxpy-l1", run_cblas_daxpy),
              ("cblas-dgemv-l2", run_cblas_dgemv),
              ("cblas-dgemm-l3", run_cblas_dgemm),
          )
          if tuple(case_id for case_id, _ in cases) != expected_case_ids:
              raise SystemExit("Windows CBLAS smoke case identities are missing or reordered")

          case_results = []
          for case_id, runner in cases:
              try:
                  observed, expected = runner()
                  passed = (
                      all(math.isfinite(value) for value in observed)
                      and observed == expected
                  )
                  error = None
              except Exception as exception:
                  observed = None
                  expected = None
                  passed = False
                  error = f"{type(exception).__name__}: {exception}"
              case_results.append(
                  {
                      "id": case_id,
                      "passed": passed,
                      "observed": observed,
                      "expected": expected,
                      "error": error,
                  }
              )

          observed_case_ids = tuple(result["id"] for result in case_results)
          summary = {
              "executed": len(case_results),
              "passed": sum(result["passed"] for result in case_results),
              "failed": sum(not result["passed"] for result in case_results),
              "skipped": 0,
          }
          expected_summary = {
              "executed": 3,
              "passed": 3,
              "failed": 0,
              "skipped": 0,
          }
          if (
              observed_case_ids != expected_case_ids
              or len(case_results) != len(expected_case_ids)
              or summary != expected_summary
          ):
              raise SystemExit(
                  "Windows CBLAS L1-L3 compatibility smoke failed: "
                  f"results={case_results!r}; summary={summary!r}; "
                  f"expected_summary={expected_summary!r}"
              )
          completion = {
              "contract": "zynum-windows-dll-cblas-smoke",
              "version": 1,
              "nonce": completion_nonce,
              "case_ids": list(expected_case_ids),
              "summary": summary,
          }
          print(
              json.dumps(
                  completion,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
              ),
              flush=True,
          )
          '@
          $completionNonce = [guid]::NewGuid().ToString('N')
          $smokeOutput = @(& $env:TRUSTED_PYTHON -I -B -c $smokeScript $completionNonce)
          $smokeExitCode = $LASTEXITCODE
          if ($null -eq $smokeExitCode -or $smokeExitCode -ne 0) {
            throw "Windows DLL/CBLAS smoke failed with exit code $smokeExitCode"
          }
          if ($smokeOutput.Count -ne 1) {
            throw "Windows DLL/CBLAS smoke must emit exactly one stdout line; observed $($smokeOutput.Count)"
          }
          $expectedCompletion = '{"case_ids":["cblas-daxpy-l1","cblas-dgemv-l2","cblas-dgemm-l3"],"contract":"zynum-windows-dll-cblas-smoke","nonce":"' + $completionNonce + '","summary":{"executed":3,"failed":0,"passed":3,"skipped":0},"version":1}'
          if ($smokeOutput[0] -cne $expectedCompletion) {
            throw "Windows DLL/CBLAS smoke completion record is missing or invalid: $($smokeOutput[0])"
          }

